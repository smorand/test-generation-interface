<div class="tgi-progress" role="status">
  <div class="bx--progress-bar">
    <div class="bx--progress-bar__track">
      <div class="bx--progress-bar__bar" :style="`width: ${percent}%`"></div>
    </div>
  </div>
  <p class="bx--type-helper-text-01">
    <span x-text="status"></span> — <span x-text="percent"></span>%
  </p>
  <div class="bx--inline-notification bx--inline-notification--error" role="alert" x-show="status === 'failed'">
    <div class="bx--inline-notification__details">
      <p class="bx--inline-notification__text" x-text="error"></p>
    </div>
  </div>
</div>
