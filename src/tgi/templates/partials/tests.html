{% if tests %}
<div class="space-y-4">
  <div class="flex items-center justify-between mb-2">
    <span class="text-sm text-gray-400">{{ tests|length }} test(s) générés</span>
  </div>
  {% for test in tests %}
  <div class="card test-card" id="test-{{ test.id }}"
    x-data="testEditor('{{ project_id }}', {{ test | tojson }})"
  >
    <div class="flex items-start justify-between mb-2">
      <div class="flex items-center gap-2">
        <span class="font-mono text-xs text-blue-400">{{ test.id }}</span>
        <span class="text-xs text-gray-500">{{ test.bloc_id }}</span>
        <span class="badge {% if test.status == 'validated' %}badge-green{% elif test.status == 'rejected' %}badge-red{% else %}badge-gray{% endif %}">
          {{ test.status }}
        </span>
      </div>
      <div class="flex gap-2">
        <button class="btn-secondary text-xs" @click="editing = !editing" x-text="editing ? 'Annuler' : '✏ Éditer'"></button>
        <button class="btn-secondary text-xs" x-show="editing" @click="saveTest()">💾 Sauvegarder</button>
      </div>
    </div>

    <!-- View mode -->
    <div x-show="!editing">
      <div class="text-sm font-semibold mb-1" x-text="test.name"></div>
      <div class="text-xs text-gray-400 mb-2" x-text="test.business_rule"></div>
      <div class="text-xs text-gray-300 mb-3" x-text="test.description"></div>
      <ol class="space-y-2">
        <template x-for="step in test.steps" :key="step.order">
          <li class="flex gap-3 text-xs">
            <span class="text-blue-400 font-mono w-5 shrink-0" x-text="step.order"></span>
            <div class="flex-1">
              <div class="text-gray-200" x-text="step.description"></div>
              <div class="text-green-400 mt-0.5">→ <span x-text="step.expected_result"></span></div>
            </div>
          </li>
        </template>
      </ol>
    </div>

    <!-- Edit mode -->
    <div x-show="editing" class="space-y-3">
      <div>
        <label class="label">Nom</label>
        <input type="text" class="input w-full text-sm" x-model="draft.name" />
      </div>
      <div>
        <label class="label">Règle métier</label>
        <input type="text" class="input w-full text-sm" x-model="draft.business_rule" />
      </div>
      <div>
        <label class="label">Description</label>
        <textarea class="input w-full text-sm h-16 resize-none" x-model="draft.description"></textarea>
      </div>
      <div>
        <label class="label">Statut</label>
        <select class="input text-sm" x-model="draft.status">
          <option value="draft">draft</option>
          <option value="validated">validated</option>
          <option value="rejected">rejected</option>
        </select>
      </div>
      <div>
        <label class="label">Étapes</label>
        <template x-for="(step, idx) in draft.steps" :key="idx">
          <div class="flex gap-2 mb-2">
            <span class="text-gray-500 text-xs w-5 pt-2" x-text="step.order"></span>
            <div class="flex-1 space-y-1">
              <input type="text" class="input w-full text-xs" x-model="step.description" placeholder="Action" />
              <input type="text" class="input w-full text-xs" x-model="step.expected_result" placeholder="Résultat attendu" />
            </div>
          </div>
        </template>
        <button class="btn-secondary text-xs mt-1" @click="addStep()">+ Étape</button>
      </div>
    </div>

    <div class="text-xs text-gray-600 mt-3">Créé: {{ test.created_at[:10] }} &bull; Modifié: {{ test.updated_at[:10] }}</div>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="text-gray-500 text-sm">Aucun test généré. Lancez le pipeline pour commencer.</div>
{% endif %}

<script>
function testEditor(projectId, initialTest) {
  return {
    projectId,
    test: initialTest,
    draft: JSON.parse(JSON.stringify(initialTest)),
    editing: false,
    addStep() {
      const next = this.draft.steps.length + 1;
      this.draft.steps.push({ order: next, description: '', expected_result: '' });
    },
    async saveTest() {
      try {
        const r = await fetch(`/projects/${this.projectId}/tests/${this.test.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(this.draft),
        });
        if (r.ok) {
          const updated = await r.json();
          this.test = updated;
          this.draft = JSON.parse(JSON.stringify(updated));
          this.editing = false;
        }
      } catch (e) {
        console.error('Save failed', e);
      }
    },
  };
}
</script>
