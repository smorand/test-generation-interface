<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Générateur de tests{% endblock %}</title>
  <!-- IBM Carbon Design System: CSS + Web Components via CDN, no bundler (NFR Deployment). -->
  <link rel="stylesheet" href="https://unpkg.com/carbon-components@10/css/carbon-components.min.css" />
  <link rel="stylesheet" href="/static/style.css?v={{ build }}" />
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    // FastAPI returns a string `detail` for our own HTTPExceptions, but an array of
    // {msg, loc, ...} objects for a 422 raised by request validation before our route
    // code runs (e.g. a malformed field). Rendering that array directly used to show
    // the literal text "[object Object]".
    function tgiErrorText(detail) {
      if (typeof detail === 'string') return detail;
      if (Array.isArray(detail)) return detail.map(e => (e && e.msg) || JSON.stringify(e)).join('; ');
      if (detail) return JSON.stringify(detail);
      return 'Erreur';
    }
  </script>
</head>
<body class="bx--body tgi-body">

  <header class="bx--header" role="banner">
    <a href="/" class="bx--header__name">
      <span class="bx--header__name--prefix">TGI&nbsp;</span>Générateur de tests
    </a>
    <nav class="bx--header__nav" aria-label="Navigation principale">
      <ul class="bx--header__menu-bar">
        <li><a href="/" class="bx--header__menu-item">Travail</a></li>
        <li><a href="/parametres" class="bx--header__menu-item">Paramètres</a></li>
      </ul>
    </nav>
    <span class="tgi-build" title="Version du code servi">build {{ build }}</span>
  </header>

  <main class="tgi-main bx--grid bx--grid--full-width">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
